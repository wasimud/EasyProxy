# fly.toml app configuration file generated for easyproxy-yaiklq on 2026-09-25T14:28:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'easyproxy-yaiklq'
primary_region = 'iad'

[build]

[env]
  PORT = '7860'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
